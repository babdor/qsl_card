<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>QSL Card Workshop</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>QSL Workshop</h1>
    <span class="de">de <b>KI5KMW</b></span>
    <p class="status" id="status" aria-live="polite"></p>
  </header>
  <div class="app">
    <section class="stagecol" aria-label="Card">
      <div class="bar">
        <div class="seg" role="group" aria-label="Card side">
          <button type="button" id="sideFront" aria-pressed="true">Front</button>
          <button type="button" id="sideBack" aria-pressed="false">Back</button>
        </div>
        <button type="button" id="undo">Undo</button>
        <button type="button" id="redo">Redo</button>
        <label class="selpick" for="pickSel"><span>Selected</span><select id="pickSel"></select></label>
        <span class="sp"></span>
        <label class="chk" for="guides"><input type="checkbox" id="guides" checked>Print guides</label>
        <label class="chk" for="snap"><input type="checkbox" id="snap" checked>Snap</label>
      </div>
      <div class="stage" id="stage"><canvas id="cv" width="1140" height="740" role="img" aria-label="QSL card editing area"></canvas></div>
      <div class="under">
        <p class="legend"><span><i style="border-color:#E5007D"></i>Bleed edge: art must reach it</span><span><i style="border-color:#0A66FF"></i>Trim: where it is cut</span><span><i style="border-color:#11A64A;border-top-style:dashed"></i>Safe zone: keep text inside</span></p>
        <button type="button" id="creditBtn" title="A small line on the back: Made with QSL Workshop de KI5KMW">Remove the credit line</button>
        <button type="button" class="other" id="flip"><canvas id="mini" width="224" height="142"></canvas><span id="flipLabel">Edit the back</span></button>
      </div>
    </section>
    <aside class="side" id="side" aria-label="Tools">
      <div class="tabs" role="tablist" id="tabs"></div>
      <div id="tabhost"></div>
    </aside>
  </div>
</div>
<input type="file" id="pickImg" accept="image/*,.jpg,.jpeg,.png,.webp,.gif,.bmp,.svg,.avif" multiple hidden>
<input type="file" id="pickFont" accept=".ttf,.otf,.woff,.woff2" multiple hidden>
<input type="file" id="pickDesign" accept=".json,application/json" hidden>
<div id="printHost" aria-hidden="true"></div>
<style id="printPage"></style>
<script defer src="js/app.js"></script>
</body>
</html>

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript font/woff font/woff2 image/svg+xml;

  # The app is a single page; nothing to route, just serve it.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Fonts and hashed static assets rarely change; cache them aggressively.
  location /fonts/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location ~* \.(?:css|js)$ {
    add_header Cache-Control "public, max-age=86400";
  }
}
